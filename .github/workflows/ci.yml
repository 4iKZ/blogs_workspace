name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (type-check + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full check (type-check → eslint → vitest → knip → build)
        run: npm run check

  backend:
    name: Backend (compile + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 后端测试现状：src/test/resources/application.yml 被 gitignore，
      # 且 mvn test 存在历史失败（见 AGENTS.md），故 CI v1 只做编译打包。
      # 要打开测试门禁，先补齐测试配置并修复历史失败。
      - name: Package (skip tests)
        run: ./mvnw -B -DskipTests package
