name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (type-check + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full check (type-check → eslint → vitest → knip → build)
        run: npm run check

  backend:
    name: Backend (unit tests + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 后端测试分两层：
      # - 纯单元测试：CI 跑，有门禁
      # - Spring 集成测试：缺 application.yml，全挂，暂时排除
      #   要打开需补齐 src/test/resources/application.yml（H2 + mock），见 AGENTS.md
      - name: Unit tests (exclude Spring integration tests)
        run: ./mvnw -B -Pci test

      - name: Package
        run: ./mvnw -B -DskipTests package
