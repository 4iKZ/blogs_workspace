# DAO 测试配置。默认使用内存 H2（MySQL 兼容模式），不连接任何外部服务，可在任何机器上直接运行。
# 需要在真实 MySQL 上运行 @Tag("mysql") 的用例时，通过环境变量覆盖下列 DAO_* 参数，见 AGENTS.md。
spring:
  config:
    activate:
      on-profile: dao-test
  datasource:
    url: ${DAO_DB_URL:jdbc:h2:mem:daotest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DAO_DB_DRIVER:org.h2.Driver}
    username: ${DAO_DB_USERNAME:sa}
    password: ${DAO_DB_PASSWORD:}
  sql:
    init:
      # H2 由测试自己建表建数据；MySQL 库由 CI 或开发者先按 database/ 脚本初始化，这里设为 never
      mode: ${DAO_SQL_INIT_MODE:always}
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  type-aliases-package: com.blog.entity
  mapper-locations: classpath*:/mapper/*.xml

logging:
  level:
    com.blog: info
    org.springframework: info
